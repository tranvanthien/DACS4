# Cấu hình Coturn TURN Server cho LinguaMeet WebRTC P2P
# Đường dẫn: /etc/turnserver.conf

# Cổng lắng nghe STUN / TURN
listening-port=3478
tls-listening-port=5349

# IP lắng nghe (để trống hoặc đặt IP public của VPS)
# listening-ip=0.0.0.0
# relay-ip=YOUR_VPS_PUBLIC_IP

# Realm (thường là domain của bạn)
realm=your-domain.com

# Cơ chế xác thực an toàn Long-term credential
lt-cred-mech

# Tài khoản TURN (khớp với TURN_USERNAME & TURN_CREDENTIAL trong .env)
user=linguameet_user:YourStrongTurnPassword2026

# Dải cổng mở cho WebRTC UDP Relay (Cần mở firewall UDP 49152-65535)
min-port=49152
max-port=65535

# Chứng chỉ SSL nếu dùng TURNS (TLS)
# cert=/etc/letsencrypt/live/your-domain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/your-domain.com/privkey.pem

# Log
log-file=/var/log/turnserver.log
verbose
no-cli
no-tcp-relay
