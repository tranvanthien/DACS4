# Cấu hình Nginx cho LinguaMeet — Reverse Proxy + SSL + WebSocket
# Đường dẫn: /etc/nginx/sites-available/linguameet.conf

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Tối ưu kích thước upload và buffers
    client_max_body_size 50M;

    # 1. Phục vụ Frontend Static Files trực tiếp qua Nginx
    location /ui/ {
        alias /var/www/linguameet/ai-meeting-translator/frontend/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. WebSocket Signaling & Audio Stream
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối WebSocket liên tục trong các cuộc họp kéo dài
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. REST API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Root redirect sang User Portal
    location = / {
        return 301 /ui/user/login.html;
    }
}
