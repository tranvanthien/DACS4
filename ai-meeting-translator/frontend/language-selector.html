<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Cài đặt ngôn ngữ – AI Meeting Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 0 16px;
            background: #f5f5f5;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 12px #0001;
        }

        h2 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 24px;
            font-size: 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #4338ca;
        }

        #msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            min-height: 20px;
        }

        .ok {
            color: #16a34a;
        }

        .err {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>🌐 Cài đặt ngôn ngữ</h2>

        <div class="field">
            <label>User ID</label>
            <input id="userId" type="number" placeholder="1" />
        </div>
        <div class="field">
            <label>Ngôn ngữ tôi nói</label>
            <select id="speakLang"></select>
        </div>
        <div class="field">
            <label>Ngôn ngữ tôi muốn nghe</label>
            <select id="listenLang"></select>
        </div>

        <button onclick="save()">💾 Lưu ngôn ngữ</button>
        <div id="msg"></div>
    </div>

    <script>
        const API = 'http://127.0.0.1:8000';

        async function loadLanguages() {
            try {
                const res = await fetch(API + '/api/languages');
                const langs = await res.json();
                ['speakLang', 'listenLang'].forEach(function (id) {
                    var sel = document.getElementById(id);
                    langs.forEach(function (l) {
                        var opt = document.createElement('option');
                        opt.value = l.code;
                        opt.textContent = (l.flag || '') + ' ' + l.name;
                        sel.appendChild(opt);
                    });
                });
            } catch (e) {
                document.getElementById('msg').className = 'err';
                document.getElementById('msg').textContent = 'Không kết nối được server';
            }
        }

        async function save() {
            var userId = document.getElementById('userId').value.trim();
            var speakLang = document.getElementById('speakLang').value;
            var listenLang = document.getElementById('listenLang').value;
            var msg = document.getElementById('msg');

            if (!userId) {
                msg.className = 'err';
                msg.textContent = 'Nhập User ID';
                return;
            }

            try {
                var res = await fetch(API + '/api/users/' + userId + '/languages', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ speaking_language: speakLang, listening_language: listenLang })
                });
                if (!res.ok) {
                    var d = await res.json();
                    throw new Error(d.detail || 'Lỗi');
                }
                msg.className = 'ok';
                msg.textContent = 'Da luu: noi ' + speakLang + ', nghe ' + listenLang;
            } catch (e) {
                msg.className = 'err';
                msg.textContent = 'Loi: ' + e.message;
            }
        }

        loadLanguages();
    </script>
</body>

</html>
