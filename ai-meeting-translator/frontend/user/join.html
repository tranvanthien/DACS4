<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" href="../favicon.ico" />
  <title>Tham gia phòng — LinguaMeet</title>
  <link rel="stylesheet" href="user.css" />
</head>

<body>
  <div id="toast-container"></div>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="card" style="max-width:400px;width:100%;padding:32px;text-align:center;">

      <div style="font-size:2.5rem;margin-bottom:12px;">🌐</div>
      <h2 style="font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:6px;">LinguaMeet</h2>
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:24px;" id="joinMsg">Bạn được mời tham gia phòng
        họp</p>

      <div id="roomCodeBox"
        style="background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);border-radius:12px;padding:16px;margin-bottom:24px;display:none;">
        <div
          style="font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">
          Mã phòng</div>
        <div id="roomCodeShow"
          style="font-family:monospace;font-size:1.8rem;font-weight:800;color:var(--cyan);letter-spacing:.12em;">—</div>
      </div>

      <div id="loginPrompt" style="display:none;">
        <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:16px;">Bạn cần đăng nhập để tham gia</p>
        <a id="loginLink" href="login.html" class="btn btn-primary w-full" style="justify-content:center;display:flex;">
          Đăng nhập để tham gia →
        </a>
        <a href="register.html" class="btn btn-ghost w-full"
          style="justify-content:center;display:flex;margin-top:8px;">
          Tạo tài khoản mới
        </a>
      </div>

      <div id="joinAction" style="display:none;">
        <button class="btn btn-primary w-full" style="justify-content:center;" onclick="goToLobby()">
          Vào phòng họp →
        </button>
      </div>

      <div id="errBox" class="form-error" style="display:none;margin-top:16px;"></div>
    </div>
  </div>

  <script src="user.js"></script>
  <script>
    const roomCode = new URLSearchParams(location.search).get('room') || '';

    function showErr(msg) {
      const el = document.getElementById('errBox');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function goToLobby() {
      if (!roomCode) return;
      const user = U.load();
      const speak = user?.speaking_language || 'vi';
      const listen = user?.listening_language || 'en';
      location.href = `lobby.html?room=${encodeURIComponent(roomCode)}&speakLang=${speak}&listenLang=${listen}`;
    }

    async function init() {
      if (!roomCode) {
        showErr('Không tìm thấy mã phòng trong đường dẫn.');
        return;
      }

      document.getElementById('roomCodeShow').textContent = roomCode;
      document.getElementById('roomCodeBox').style.display = 'block';

      // Kiểm tra phòng có tồn tại không
      try {
        const res = await fetch(`${API}/api/rooms/${roomCode}`);
        if (!res.ok) {
          showErr(res.status === 404 ? 'Phòng họp không tồn tại hoặc đã đóng.' : `Lỗi ${res.status}`);
          return;
        }
        const room = await res.json();
        if (!room.is_active) {
          showErr('Phòng họp này đã đóng.');
          document.getElementById('joinMsg').textContent = 'Phòng họp đã đóng';
          return;
        }
        document.getElementById('joinMsg').textContent = `Tham gia: ${room.room_name}`;
      } catch (_) {
        showErr('Không thể kết nối máy chủ.');
        return;
      }

      // Kiểm tra đã đăng nhập chưa
      const user = U.load();
      if (!user) {
        // Lưu redirect target để sau khi login quay lại
        sessionStorage.setItem('lm_after_login', location.href);
        document.getElementById('loginPrompt').style.display = 'block';
        // Cập nhật link đăng nhập kèm redirect
        document.getElementById('loginLink').href = `login.html?redirect=${encodeURIComponent(location.href)}`;
      } else {
        document.getElementById('joinAction').style.display = 'block';
      }
    }

    init();
  </script>
</body>

</html>
